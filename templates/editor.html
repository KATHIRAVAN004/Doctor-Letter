{% extends "base.html" %}{% block content %}
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
<h2>Edit {{ cfg.label }}</h2>
<form method="post" action="{{ url_for('finalize', letter_type=letter_type) }}" id="f">
 <input type="hidden" name="title" value="{{ cfg.label }} - {{ title }}">
 <input type="hidden" name="body" id="body">
 <div id="editor" style="height:380px">{{ body|safe }}</div>
 <br><button>Finalize &amp; save</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
 const q = new Quill('#editor', {theme:'snow', modules:{toolbar:[[{header:[1,2,3,false]}],['bold','italic','underline'],[{list:'ordered'},{list:'bullet'}],[{align:[]}],['clean']]}});
 document.getElementById('f').onsubmit = () => { document.getElementById('body').value = q.root.innerHTML; };
</script>
{% endblock %}
